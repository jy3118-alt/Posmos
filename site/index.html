<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9dbbd"><title>물감 마을</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body><main class="viewer">
<canvas id="model" aria-label="물감으로 만든 언덕 마을. Po 150명과 Moa 1명이 쉬고 산책하는 공간."></canvas>
<div id="loading" role="status"><span>❧</span><p>물감 마을을 열고 있어요</p><small>새 마을과 친구들의 동작을 준비하고 있어요.</small></div>
<div class="hud"><nav class="time-strip" aria-label="시간대 선택">
<button data-time="morning" data-phase="0.02" aria-label="아침" title="아침" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 21h14M7 17a5 5 0 0 1 10 0M12 2v3M4.2 7.2l2.1 2.1M19.8 7.2l-2.1 2.1M2 12h2M20 12h2"/></svg></button>
<button data-time="afternoon" data-phase="0.44" aria-label="오후 · 노을" title="오후 · 노을" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M5 21h14M7 17a5 5 0 0 1 10 0M12 2v6m-3-3 3 3 3-3M3 10l2 2M21 10l-2 2"/></svg></button>
<button data-time="night" data-phase="0.68" aria-label="밤" title="밤" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5Z"/><path d="M17 3v4M15 5h4"/></svg></button>
</nav>
<aside class="settings"><button id="settings" aria-expanded="false" aria-controls="panel"><span>감상 설정</span><b>+</b></button><div id="panel" hidden>
<p class="panel-label">천천히 흐르는 시간</p><p id="time-label">오전의 빛</p><p id="activity" class="activity">풍경을 바라보는 중</p>
<div class="sound"><button id="audio" aria-pressed="false"><span>바람 소리</span></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.28" aria-label="배경음 볼륨"></div>
<div class="options"><button id="tilt" aria-pressed="true">틸트 시프트</button><button id="fullscreen">전체 화면</button><button id="hide">UI 숨기기</button></div>
<p class="panel-note">캐릭터 클릭 추적 · 다시 클릭 해제<br>왼쪽 드래그 회전 · 오른쪽 드래그 이동<br>휠 확대 · H 화면만 보기</p></div></aside>

<div class="zoom"><button id="zoom-in" aria-label="확대">+</button><button id="zoom-out" aria-label="축소">−</button></div>
</div><button id="show" hidden>설정 보기 <span>H</span></button><div id="notice" hidden role="status"></div></main><script type="module" src="./review.js"></script></body></html>
